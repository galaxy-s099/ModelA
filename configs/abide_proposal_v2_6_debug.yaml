data:
  data_root: /kaggle/input/datasets/xingyushen666/abide-fc-three-atlas-new
  atlases:
    aal:
      num_nodes: 116
      fc_file: X_aal.npy
    cc200:
      num_nodes: 200
      fc_file: X_cc200.npy
    ho:
      num_nodes: 111
      fc_file: X_ho.npy

train:
  seeds: [0]
  n_splits: 2
  epochs: 2
  batch_size: 16
  lr: 1.0e-3
  weight_decay: 1.0e-4
  use_best_val: false

model:
  model_name: smaf_edge_energy_v2_2
  hidden_dim: 64
  embedding_dim: 64
  dropout: 0.5
  temperature: 1.0

loss:
  lambda_branch: 0.2
  lambda_reg: 0.075
  margin: 0.1
  regularization_mode: proposal_literal
