# v11.0: v6.6 with a fold-local GPU Tangent Pearson branch per atlas.
data:
  data_root: /kaggle/input/datasets/xingyushen666/abide-fc-three-atlas-new
  atlases:
    aal:
      num_nodes: 116
      fc_file: X_aal.npy
    cc200:
      num_nodes: 200
      fc_file: X_cc200.npy
    ho:
      num_nodes: 111
      fc_file: X_ho.npy

train:
  seeds: [0, 1, 2, 3, 4]
  n_splits: 5
  epochs: 80
  batch_size: 32
  lr: 1.0e-3
  weight_decay: 1.0e-4
  use_best_val: false
  checkpoint_ensemble: true
  checkpoint_ensemble_start: 55
  checkpoint_ensemble_interval: 5

# This preprocessing uses torch.linalg.eigh on the active training device.
# With Kaggle GPU enabled, Tangent feature construction and model training run
# on CUDA. The reference is fitted on the current outer training fold only.
tangent:
  shrinkage: 0.05
  eigenvalue_floor: 1.0e-6
  batch_size: 32

model:
  model_name: smaf_edge_energy_v2_2
  hidden_dim: 256
  embedding_dim: 128
  dropout: 0.5
  temperature: 1.0
  use_sample_gate: true
  use_tangent_branch: true

loss:
  lambda_branch: 0.2
  lambda_reg: 0.1
  margin: 0.1
  regularization_mode: proposal_literal
